services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - postgres.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ignes -d ignes"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  core:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - core.env
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ignes_ssh_keys:/root/.ssh

volumes:
  pgdata:
  ignes_ssh_keys: